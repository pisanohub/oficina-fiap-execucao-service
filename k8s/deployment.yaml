apiVersion: apps/v1
kind: Deployment

metadata:
  name: execucao-service
  namespace: oficina-ms

spec:
  replicas: 1

  selector:
    matchLabels:
      app: execucao-service

  template:
    metadata:
      labels:
        app: execucao-service

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:

        - name: execucao-service

          image: IMAGE_NAME

          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management

          envFrom:

            - configMapRef:
                name: execucao-service-config

          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: license-key
                  optional: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:

            httpGet:
              path: /actuator/health/readiness
              port: 8081

            initialDelaySeconds: 60
            periodSeconds: 30

          livenessProbe:

            httpGet:
              path: /actuator/health/liveness
              port: 8081

            initialDelaySeconds: 90
            periodSeconds: 30
