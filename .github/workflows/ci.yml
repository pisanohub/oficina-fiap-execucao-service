name: Execucao Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-test:

    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Build + Tests
        run: ./mvnw clean verify

      - name: Sonar sem token configurado
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SONAR_TOKEN não configurado: a análise do Sonar foi ignorada."
          if [ "${{ vars.SONAR_REQUIRED }}" = "true" ]; then
            echo "SONAR_REQUIRED=true: a análise do Sonar é obrigatória." >&2
            exit 1
          fi

      - name: Análise Sonar e quality gate
        if: env.SONAR_TOKEN != ''
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
            ${SONAR_PROJECT_KEY:+-Dsonar.projectKey="$SONAR_PROJECT_KEY"} \
            ${SONAR_ORGANIZATION:+-Dsonar.organization="$SONAR_ORGANIZATION"} \
            -Dsonar.qualitygate.wait=true
