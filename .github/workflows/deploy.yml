name: Execucao Service CD - Deploy Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}
  NAMESPACE: oficina-ms

jobs:

  docker-build-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_NAME }}

  deploy-kubernetes:

    needs: docker-build-push

    runs-on: ubuntu-latest

    env:
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      # Base das URLs das filas (conta e região). Pode ser trocada pela variável de repositório SQS_BASE_URL.
      SQS_BASE_URL: ${{ vars.SQS_BASE_URL || 'https://sqs.us-east-1.amazonaws.com/381492182695' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"

      - name: Verificar cluster
        run: kubectl get nodes

      - name: Criar namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Criar secret de acesso ao GHCR (pull da imagem)
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar secret de ingestão do New Relic
        if: env.NEW_RELIC_LICENSE_KEY != ''
        run: |
          kubectl create secret generic newrelic-license \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=license-key="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap
        run: |
          # O profile newrelic exporta os traces por OTLP; só é ligado quando a license key existe.
          PERFIL=""
          if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then PERFIL="--from-literal=SPRING_PROFILES_ACTIVE=newrelic"; fi
          # As credenciais AWS vêm do perfil da instância (LabRole) pela cadeia padrão do SDK.
          kubectl create configmap execucao-service-config \
            $PERFIL \
            --from-literal=AWS_REGION="us-east-1" \
            --from-literal=DYNAMODB_TABLE_NAME="execucao_service" \
            --from-literal=SQS_EXECUCAO_COMANDOS_URL="$SQS_BASE_URL/execucao-comandos" \
            --from-literal=SQS_EXECUCAO_RESULTADOS_URL="$SQS_BASE_URL/execucao-resultados" \
            --from-literal=SQS_EXECUCAO_COMANDOS_DLQ_URL="$SQS_BASE_URL/execucao-comandos-dlq" \
            --from-literal=SQS_EXECUCAO_RESULTADOS_DLQ_URL="$SQS_BASE_URL/execucao-resultados-dlq" \
            --from-literal=SQS_CONSUMER_ENABLED="true" \
            --from-literal=OUTBOX_PUBLISHER_ENABLED="true" \
            --from-literal=SQS_METRICS_ENABLED="true" \
            --from-literal=MANAGEMENT_SERVER_PORT="8081" \
            --from-literal=OTEL_SERVICE_NAME="execucao-service" \
            --from-literal=DEPLOYMENT_ENVIRONMENT="production" \
            --from-literal=OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="https://otlp.nr-data.net/v1/traces" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml > configmap-generated.yaml
          kubectl apply -f configmap-generated.yaml
          # O checksum entra no template do Deployment: mudar o ConfigMap força um novo rollout.
          echo "CONFIG_CHECKSUM=$(sha256sum configmap-generated.yaml | cut -c1-64)" >> "$GITHUB_ENV"

      - name: Atualizar imagem no manifesto
        run: |
          sed -e "s|IMAGE_NAME|${{ env.IMAGE_NAME }}|" \
              -e "s|CONFIG_CHECKSUM|$CONFIG_CHECKSUM|" \
              k8s/deployment.yaml > k8s/deployment-generated.yaml

      - name: Deploy aplicação
        run: kubectl apply -f k8s/deployment-generated.yaml

      - name: Expor aplicação
        run: kubectl apply -f k8s/service.yaml

      - name: Expor métricas internamente
        run: kubectl apply -f k8s/metrics-service.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/execucao-service -n ${{ env.NAMESPACE }}

      - name: Exibir logs da aplicação
        # Deixa visíveis no Actions erros de permissão do SQS/DynamoDB (AccessDenied) logo após o deploy.
        if: always()
        run: kubectl logs deployment/execucao-service -n ${{ env.NAMESPACE }} --tail=50 || true

      - name: Exibir recursos
        run: kubectl get all -n ${{ env.NAMESPACE }}
