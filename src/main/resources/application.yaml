spring:
  application:
    name: execucao-service

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb-endpoint: ${DYNAMODB_ENDPOINT_URL:}
  sqs-endpoint: ${SQS_ENDPOINT_URL:}

dynamodb:
  table-name: ${DYNAMODB_TABLE_NAME:execucao_service}

sqs:
  execucao-resultados-url: ${SQS_EXECUCAO_RESULTADOS_URL:}
  execucao-comandos-url: ${SQS_EXECUCAO_COMANDOS_URL:}
  consumer:
    enabled: ${SQS_CONSUMER_ENABLED:false}
    poll-delay-ms: ${SQS_CONSUMER_POLL_DELAY_MS:5000}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
