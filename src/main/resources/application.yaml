spring:
  application:
    name: execucao-service

springdoc:
  override-with-generic-response: false
  default-produces-media-type: application/json

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb-endpoint: ${DYNAMODB_ENDPOINT_URL:}
  sqs-endpoint: ${SQS_ENDPOINT_URL:}

dynamodb:
  table-name: ${DYNAMODB_TABLE_NAME:execucao_service}

sqs:
  execucao-resultados-url: ${SQS_EXECUCAO_RESULTADOS_URL:}
  execucao-comandos-url: ${SQS_EXECUCAO_COMANDOS_URL:}
  execucao-resultados-dlq-url: ${SQS_EXECUCAO_RESULTADOS_DLQ_URL:}
  execucao-comandos-dlq-url: ${SQS_EXECUCAO_COMANDOS_DLQ_URL:}
  metrics:
    enabled: ${SQS_METRICS_ENABLED:false}
    poll-delay-ms: ${SQS_METRICS_POLL_DELAY_MS:60000}
  consumer:
    enabled: ${SQS_CONSUMER_ENABLED:false}
    poll-delay-ms: ${SQS_CONSUMER_POLL_DELAY_MS:5000}
    max-messages: ${SQS_CONSUMER_MAX_MESSAGES:10}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    enable:
      "[tasks.scheduled]": false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
